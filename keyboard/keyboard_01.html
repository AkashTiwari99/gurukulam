<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Sanskrit Keyboard - Devanagari</title>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <meta name="description"
        content="Modern online Vedic Sanskrit keyboard for typing Devanagari characters with Vedic diacritics">
    <link rel="stylesheet" href="css/CSS_key.css">
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <nav class="compact-nav" aria-label="Gurukulam navigation">
        <a href="../index.html">&larr; Gurukulam Home</a>
        <div class="compact-nav-links">
            <a href="../books.html">Books</a>
            <a href="../contact.html">Contact</a>
        </div>
    </nav>
    <div class="container">
        <header class="header">
            <h1>Vedic Sanskrit Keyboard</h1>
            <p>Type Devanagari characters with Vedic diacritics</p>
        </header>

        <main id="main-content">
            <div class="text-area-container">
                <div class="section-toggles-above">
                    <button type="button" class="btn btn-toggle" id="toggle-keyboard" aria-expanded="true"
                        aria-controls="sanskrit-keyboard">⌨️ Hide Keyboard</button>
                    <button type="button" class="btn btn-secondary" id="theme-toggle">🌙 Dark Mode</button>
                </div>

                <label for="text-input" class="text-input-label">Sanskrit Text Input</label>
                <textarea id="text-input" placeholder="Start typing in Sanskrit... / संस्कृत में टाइप करना शुरू करें..."
                    autocomplete="off" spellcheck="false"></textarea>

                <div class="controls">
                    <button type="button" class="btn btn-primary" id="copy-btn">📋 Copy</button>
                    <button type="button" class="btn btn-secondary" id="clear-btn">🗑️ Clear</button>
                    <button type="button" class="btn btn-secondary" id="download-btn">💾 Download</button>
                    <button type="button" class="btn btn-secondary" id="space-btn">Space</button>
                    <button type="button" class="btn btn-secondary" id="backspace-btn" aria-label="Backspace">⌫ Backspace</button>
                    <button type="button" class="btn btn-secondary" id="enter-btn" aria-label="New line">↵ Enter</button>
                </div>
            </div>

            <div class="keyboard-container" id="sanskrit-keyboard">
                <div class="keyboard-header">
                    <div class="keyboard-header-text">Sanskrit Keyboard (Drag Me)</div>
                    <!-- The section toggle container will be added by JavaScript -->
                </div>

                <div class="keyboard-section" id="vowels-section">
                    <h2 class="section-title">Vowels (स्वर)</h2>
                    <div class="key-group vowels" id="vowels-group"></div>
                </div>

                <div class="keyboard-section" id="consonants-section">
                    <h2 class="section-title">Consonants (व्यञ्जन)</h2>
                    <div class="key-group consonants" id="consonants-group"></div>
                </div>

                <div class="keyboard-section" id="special-section">
                    <h2 class="section-title">Special Characters &amp; Diacritics</h2>
                    <div class="key-group special" id="special-group"></div>
                </div>

                <div class="keyboard-section" id="vedic-section">
                    <h2 class="section-title">Vedic Diacritics</h2>
                    <div class="key-group special" id="vedic-group"></div>
                </div>

                <div class="keyboard-section" id="sama-section">
                    <h2 class="section-title">SAMA_svara Diacritics</h2>
                    <div class="key-group special" id="sama-group"></div>
                </div>

                <div class="keyboard-section" id="numbers-section">
                    <h2 class="section-title">Devanagari Numbers (संख्या)</h2>
                    <div class="key-group numbers" id="numbers-group"></div>
                </div>
            </div>
        </main>
    </div>
    <div class="notification" id="notification" role="status" aria-live="polite"></div>
    <script src="script/Character_data.js" defer></script>
    <script src="script/keyboard.js" defer></script>
</body>

</html>
