<!-- Enhanced Viewport and Mobile Optimization Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
<meta name="description" content="Gurukulam - Reviving Ancient Wisdom for Modern Times">
<meta name="keywords" content="Vedas, Ramayana, Yoga, Sanskrit, Sanatan Dharma, Online Learning">
<meta name="author" content="Gurukulam">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gurukulam">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<!-- Open Graph Tags for Social Media -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://gurukulam.example.com/">
<meta property="og:title" content="Gurukulam | Reviving Ancient Wisdom">
<meta property="og:description" content="Explore the eternal teachings of the Vedas, Ramayana, and Yoga">
<meta property="og:image" content="images/card1.jpg">

<!-- Twitter Card Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gurukulam | Reviving Ancient Wisdom">
<meta name="twitter:description" content="Explore the eternal teachings of the Vedas, Ramayana, and Yoga">
<meta name="twitter:image" content="images/card1.jpg">

<!-- Performance & SEO -->
<meta name="robots" content="index, follow">
<meta name="language" content="English">
<meta name="revisit-after" content="7 days">

<!-- Security -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com">

<!-- Preconnect to external resources for performance -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">

<!-- Icons for different devices -->
<link rel="icon" href="images/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

<!-- Manifest for PWA -->
<link rel="manifest" href="manifest.json">
